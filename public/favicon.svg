<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bracket-left { stroke: url(#grad1); fill: none; }
    .bracket-right { stroke: url(#grad2); fill: none; }
    .dot { fill: url(#grad2); }
    .center-i { fill: #0f172a; }
    .outline { stroke: #0f172a; fill: none; }
    
    @media (prefers-color-scheme: dark) {
      .center-i { fill: #f8fafc; }
      .outline { stroke: #f8fafc; }
    }
  </style>

  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
  </defs>

  <!-- Base canvas outline for structure -->
  <rect x="32" y="32" width="192" height="192" rx="44" class="outline" stroke-width="16" />

  <!-- Code bracket < (Left) -->
  <path d="M 96 160 L 64 128 L 96 96" class="bracket-left" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Code bracket > (Right) -->
  <path d="M 160 160 L 192 128 L 160 96" class="bracket-right" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center 'i' (for Ismael / tech index) -->
  <circle cx="128" cy="86" r="10" class="dot" />
  <rect x="118" y="112" width="20" height="58" rx="10" class="center-i" />
</svg>
